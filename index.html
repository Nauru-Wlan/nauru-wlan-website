<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1A2FA0">
<meta name="description" content="Nauru-Wlan: Windows-Tool, das per Klick eine neue, zufällige MAC-Adresse für LAN oder WLAN setzt. Einmalig 10 €, Bezahlung per Krypto.">
<title>Nauru-Wlan – Neue MAC-Adresse per Klick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" id="favicon" href="data:,">
<style>

  /* =====================================================================
     DESIGN-TOKENS
     Ultramarin, Goldstreifen und Weiss (Nauru-Flagge). Mint nur als
     Statusfarbe fuer "ok", nie als Flaeche.
  ===================================================================== */
  :root{
    --blau:   #1A2FA0;
    --blau-2: #13258A;
    --tief:   #0B1657;
    --ink:    #0C1240;
    --gold:   #F4C22B;
    --signal: #4DE8A6;
    --papier: #EEF0F5;
    --etikett:#FBFAF6;
    --muted:  #4A5178;
    --on-blue:#FFFFFF;
    --on-blue-muted: rgba(255,255,255,.78);
    --line-light: rgba(12,18,64,.18);
    --line-dark:  rgba(255,255,255,.22);
    --grid: rgba(255,255,255,.075);
    --sans: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'Martian Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
    --max: 1160px;
    --focus: var(--gold);
    --br: var(--gold);
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; background:var(--papier); color:var(--ink);
    font-family:var(--sans); font-optical-sizing:auto;
    font-size:1.0625rem; line-height:1.62;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--gold); color:var(--ink); }
  h1,h2,h3{ margin:0; line-height:1.06; letter-spacing:-.025em; font-weight:750; text-wrap:balance; }
  p{ margin:0; }
  a{ color:inherit; }
  :focus-visible{ outline:3px solid var(--focus); outline-offset:3px; border-radius:4px; }
  .wrap{ max-width:var(--max); margin:0 auto; padding:0 28px; }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  section[id]{ scroll-margin-top:72px; }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *{ animation:none !important; transition:none !important; }
  }

  /* HUD-Ecken: kleine Klammern an zwei Ecken eines Panels */
  .brackets{ position:relative; }
  .brackets::before, .brackets::after{ content:""; position:absolute; width:16px; height:16px; border:2px solid var(--br); pointer-events:none; }
  .brackets::before{ top:-6px; left:-6px; border-right:0; border-bottom:0; }
  .brackets::after{ bottom:-6px; right:-6px; border-left:0; border-top:0; }

  /* ---------------- BUTTONS (Arcade: druecken senkt den Knopf ab) ---------------- */
  .btn{
    --depth:#000; --lift:5px;
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    font:inherit; font-weight:650; font-size:1rem; letter-spacing:-.005em;
    padding:14px 24px; border-radius:10px; border:2px solid transparent;
    cursor:pointer; text-decoration:none;
    transition:transform .08s, box-shadow .08s, background .15s, border-color .15s;
  }
  .btn-gold, .btn-ink{ box-shadow:0 var(--lift) 0 var(--depth); }
  .btn-gold:hover, .btn-ink:hover{ transform:translateY(-1px); box-shadow:0 calc(var(--lift) + 1px) 0 var(--depth); }
  .btn-gold:active, .btn-ink:active{ transform:translateY(calc(var(--lift) - 1px)); box-shadow:0 1px 0 var(--depth); }
  .btn-gold{ background:var(--gold); color:var(--ink); --depth:#A57B06; }
  .btn-ink{ background:var(--ink); color:#fff; --depth:#050826; }
  .btn-line{ border-color:var(--line-dark); color:var(--on-blue); }
  .btn-line:hover{ border-color:var(--on-blue); }
  .btn:disabled{ opacity:.6; cursor:default; transform:translateY(calc(var(--lift) - 1px)); box-shadow:0 1px 0 var(--depth); }
  kbd{
    font-family:var(--mono); font-size:.68rem; font-weight:400; line-height:1;
    padding:4px 6px; border-radius:4px; border:1px solid currentColor; opacity:.7;
  }
  @media (hover:none){ kbd{ display:none; } }

  /* ---------------- NAV ---------------- */
  .nav{ position:sticky; top:0; z-index:50; background:var(--blau); color:var(--on-blue); border-bottom:1px solid var(--line-dark); }
  .nav .wrap{ display:flex; align-items:center; justify-content:space-between; height:66px; gap:24px; }
  .progress{ position:absolute; left:0; right:0; bottom:-1px; height:3px; background:var(--gold); transform-origin:left; transform:scaleX(0); }
  .brand{ display:inline-flex; align-items:center; gap:10px; font-weight:750; font-size:1.2rem; letter-spacing:-.02em; text-decoration:none; }
  .brand svg{ display:block; }
  .nav-links{ display:flex; gap:30px; font-size:.95rem; color:var(--on-blue-muted); margin-left:auto; }
  .nav-links a{ text-decoration:none; }
  .nav-links a:hover{ color:#fff; text-decoration:underline; text-underline-offset:5px; text-decoration-thickness:2px; }
  .nav-cta{ padding:10px 20px; font-size:.95rem; --lift:4px; }

  /* ---------------- HERO ---------------- */
  .hero{
    position:relative; color:var(--on-blue); overflow:hidden;
    padding:clamp(56px,8vw,104px) 0 clamp(84px,10vw,132px);
    background:
      radial-gradient(900px 520px at 88% 12%, rgba(96,128,255,.38), transparent 62%),
      linear-gradient(180deg, var(--blau) 0%, var(--blau-2) 100%);
  }
  .hero::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:56px 56px;
    -webkit-mask-image:radial-gradient(ellipse 80% 90% at 68% 40%, #000 10%, transparent 78%);
            mask-image:radial-gradient(ellipse 80% 90% at 68% 40%, #000 10%, transparent 78%);
  }
  .hero::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:9px; background:var(--gold); }
  .hero > .wrap{ position:relative; z-index:1; }
  .hero-grid{ display:grid; grid-template-columns:1fr 1.02fr; gap:clamp(36px,5vw,72px); align-items:center; }

  .chip{
    display:inline-flex; align-items:center; gap:0; margin-bottom:26px;
    font-family:var(--mono); font-size:.72rem; color:var(--on-blue-muted);
    border:1px solid var(--line-dark); border-radius:999px; padding:7px 14px; background:rgba(6,10,50,.28);
  }
  .chip .dot{ width:8px; height:8px; border-radius:50%; background:var(--signal); margin-right:12px; animation:ping 2.6s ease-out infinite; }
  .chip span + span{ border-left:1px solid var(--line-dark); margin-left:10px; padding-left:10px; }
  .chip .dot + span{ border-left:0; margin-left:0; padding-left:0; }
  @keyframes ping{ 0%{ box-shadow:0 0 0 0 rgba(77,232,166,.55); } 70%,100%{ box-shadow:0 0 0 9px rgba(77,232,166,0); } }

  .hero h1{ font-size:clamp(2.1rem,3.3vw,3.1rem); font-weight:800; letter-spacing:-.035em; line-height:1.02; }
  .hero h1 .ln{ display:block; }
  .ch{ position:relative; }
  .ch.pre, .ch.s{ color:transparent; }
  .ch.s::before{ content:attr(data-r); position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-family:var(--mono); font-size:.62em; font-weight:600; letter-spacing:0; color:var(--gold); }
  .caret{ display:inline-block; width:.46em; height:.8em; margin-left:.14em; background:var(--gold); vertical-align:-.03em; animation:blink 1.05s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  .hero .lead{ margin-top:26px; font-size:1.15rem; color:var(--on-blue-muted); max-width:44ch; }
  .cta-row{ margin-top:34px; display:flex; gap:16px; flex-wrap:wrap; }

  .demo{ min-width:0; }
  .sticker{
    container-type:inline-size; position:relative; overflow:hidden;
    background:var(--etikett); color:var(--ink);
    border-radius:14px; padding:20px 26px 22px;
    transform:rotate(-1.4deg);
    box-shadow:0 30px 50px -22px rgba(2,6,36,.6);
  }
  .sweep{ position:absolute; left:0; right:0; top:0; height:56px; opacity:0; pointer-events:none;
    background:linear-gradient(180deg, transparent, rgba(244,194,43,.55) 92%, var(--gold) 100%); }
  .sticker.scanning .sweep{ animation:sweep 1.25s ease-in-out; }
  @keyframes sweep{ 0%{ transform:translateY(-60px); opacity:0; } 12%{ opacity:1; } 88%{ opacity:1; } 100%{ transform:translateY(330px); opacity:0; } }
  .sticker-head{
    display:flex; justify-content:space-between; gap:12px;
    padding-bottom:12px; border-bottom:1.5px dashed rgba(12,18,64,.28);
    font-size:.86rem; font-weight:600; color:var(--muted);
  }
  .mac{
    font-family:var(--mono); font-weight:600; white-space:nowrap;
    font-size:clamp(1.15rem,4.2vw,2.3rem);
    font-size:7.1cqw;
    letter-spacing:-.03em; line-height:1; margin:22px 0 18px;
  }
  .mac i{ font-style:normal; color:rgba(12,18,64,.35); }
  .mac .nib{ background:var(--gold); padding:0 .04em; border-radius:3px; }
  .barcode{ display:block; width:100%; height:44px; fill:var(--ink); }
  .sticker-foot{ display:flex; align-items:center; gap:18px; margin-top:22px; flex-wrap:wrap; }
  .sticker-foot p{ font-size:.86rem; line-height:1.45; color:var(--muted); flex:1; min-width:190px; }

  .console{
    --br:var(--gold);
    margin-top:30px; background:rgba(6,10,50,.66); border:1px solid var(--line-dark); border-radius:6px;
    font-family:var(--mono); font-size:.76rem; color:var(--on-blue-muted);
  }
  .console-bar{ display:flex; justify-content:space-between; align-items:center; padding:9px 14px; border-bottom:1px solid var(--line-dark); font-size:.7rem; }
  .console-bar b{ font-weight:600; color:#fff; }
  .console-bar em{ font-style:normal; color:var(--gold); }
  .log{ list-style:none; margin:0; padding:12px 14px 6px; min-height:calc(4 * 1.8em + 18px); line-height:1.8; }
  .log li{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .log .p{ color:var(--gold); margin-right:9px; }
  .log .s{ margin-left:10px; color:rgba(255,255,255,.45); }
  .log .s.ok{ color:var(--signal); }
  .log li.final{ color:#fff; }
  .filebox{ border-top:1px dashed var(--line-dark); padding:10px 14px 12px; min-height:calc(1.8em * 4 + 20px); }
  .fname{ color:#fff; margin-bottom:4px; }
  .ledger{ list-style:none; margin:0; padding:0; line-height:1.8; }
  .ledger li{ text-decoration:line-through; text-decoration-color:var(--gold); text-decoration-thickness:2px; color:rgba(255,255,255,.9); }
  .ledger li:nth-child(2){ opacity:.65; } .ledger li:nth-child(3){ opacity:.4; }
  .ledger li.empty{ text-decoration:none; font-family:var(--sans); font-size:.86rem; line-height:1.5; opacity:1; color:var(--on-blue-muted); max-width:46ch; }

  /* ---------------- WARUM ---------------- */
  .why{ padding:clamp(72px,10vw,128px) 0; --focus:var(--blau); }
  .hero-grid > *, .why-grid > *, .trust-grid > *, .price-grid > *, .faq-grid > *{ min-width:0; }
  .why-grid{ display:grid; grid-template-columns:5fr 6fr; gap:clamp(36px,6vw,88px); align-items:start; }
  .why h2{ font-size:clamp(1.9rem,3.4vw,2.9rem); }
  .why .text{ margin-top:22px; color:var(--muted); max-width:52ch; }
  .table-scroll{ overflow-x:auto; }
  .cmp{ width:100%; border-collapse:collapse; }
  .cmp th{ text-align:left; font-weight:650; font-size:.95rem; padding:0 20px 14px 0; color:var(--muted); white-space:nowrap; }
  .cmp tbody th{ color:var(--ink); font-size:1rem; padding:18px 20px 18px 0; border-top:1.5px solid var(--line-light); }
  .cmp td{ padding:18px 20px 18px 0; border-top:1.5px solid var(--line-light); white-space:nowrap; }
  .cmp .m{ font-family:var(--mono); font-size:.84rem; }
  .cmp .same{ background:linear-gradient(transparent 60%, rgba(244,194,43,.85) 60%); }
  .tag{
    display:inline-block; margin-left:10px; padding:3px 8px; border-radius:999px;
    font-family:var(--mono); font-size:.64rem; font-weight:600; letter-spacing:0; vertical-align:2px;
  }
  .tag.bad{ background:var(--gold); color:var(--ink); }
  .tag.good{ background:var(--tief); color:var(--signal); }
  .cmp-note{ margin-top:14px; font-size:.9rem; color:var(--muted); }

  /* ---------------- FUNKTIONEN + ABLAUF ---------------- */
  .features{ padding:0 0 clamp(72px,10vw,128px); --focus:var(--blau); }
  .features h2, .steps-wrap h2{ font-size:clamp(1.7rem,3vw,2.5rem); margin-bottom:40px; }
  .feat-grid{ display:grid; grid-template-columns:1fr 1fr; column-gap:64px; }
  .feat{ border-top:2px solid var(--ink); padding:20px 0 40px; }
  .feat h3{ font-size:1.45rem; letter-spacing:-.018em; margin-bottom:8px; }
  .feat p{ color:var(--muted); max-width:46ch; }
  .steps-wrap{ margin-top:clamp(40px,6vw,72px); }
  .steps{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(4,1fr); gap:28px; counter-reset:s; }
  .steps li{ position:relative; padding-top:70px; }
  .steps li::before{
    counter-increment:s; content:"0" counter(s);
    position:absolute; top:0; left:0; width:54px; height:47px;
    clip-path:polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
    background:var(--gold); color:var(--ink); font-family:var(--mono); font-weight:600; font-size:.95rem;
    display:grid; place-items:center;
  }
  .steps li:not(:last-child)::after{
    content:""; position:absolute; top:22px; left:64px; right:-10px; height:3px; border-radius:2px;
    background:var(--line-light);
  }
  .steps.anim li::before{ background:#CDD2E6; color:#6B7299; transition:background .3s, color .3s; }
  .steps.anim li:not(:last-child)::after{
    background:linear-gradient(var(--gold), var(--gold)) left / 0% 100% no-repeat, var(--line-light);
    transition:background-size .4s linear;
  }
  .steps.anim.in li::before{ background:var(--gold); color:var(--ink); transition-delay:calc(var(--i) * 420ms); }
  .steps.anim.in li:not(:last-child)::after{ background-size:100% 100%; transition-delay:calc(var(--i) * 420ms + 220ms); }
  .steps h3{ font-size:1.2rem; margin-bottom:6px; letter-spacing:-.015em; }
  .steps p{ font-size:.98rem; color:var(--muted); }

  /* ---------------- VERTRAUEN ---------------- */
  .trust{
    position:relative; background:var(--tief); color:var(--on-blue); padding:clamp(72px,10vw,128px) 0; overflow:hidden;
  }
  .trust::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:56px 56px;
    -webkit-mask-image:radial-gradient(ellipse 70% 80% at 20% 30%, #000, transparent 75%);
            mask-image:radial-gradient(ellipse 70% 80% at 20% 30%, #000, transparent 75%);
  }
  .trust > .wrap{ position:relative; }
  .trust-grid{ display:grid; grid-template-columns:5fr 6fr; gap:clamp(36px,6vw,88px); align-items:start; }
  .trust h2{ font-size:clamp(1.9rem,3.4vw,2.9rem); }
  .trust .text{ margin-top:20px; color:var(--on-blue-muted); max-width:46ch; }
  .vt{ margin-top:36px; }
  .vt-grid{ display:grid; grid-template-columns:repeat(16,1fr); gap:5px; }
  .vt-grid span{ aspect-ratio:1; border-radius:3px; background:rgba(255,255,255,.16); }
  .vt-grid span.hit{ background:var(--gold); }
  .vt.anim .vt-grid span{ opacity:.14; }
  .vt.anim .vt-grid span.hit{ background:rgba(255,255,255,.16); }
  .vt.anim.in .vt-grid span{ animation:cellon .35s ease forwards; animation-delay:calc(var(--i) * 15ms); }
  .vt.anim.in .vt-grid span.hit{ animation-name:hiton; animation-duration:.6s; animation-delay:calc(1050ms + var(--h) * 170ms); }
  @keyframes cellon{ to{ opacity:1; } }
  @keyframes hiton{ 0%{ opacity:.14; } 45%{ opacity:1; background:#fff; transform:scale(1.3); } 100%{ opacity:1; background:var(--gold); transform:scale(1); } }
  .vt p{ margin-top:14px; font-size:.95rem; color:var(--on-blue-muted); }
  .facts{ list-style:none; margin:0; padding:0; }
  .facts li{ padding:22px 0; border-top:1px solid var(--line-dark); }
  .facts li:last-child{ border-bottom:1px solid var(--line-dark); }
  .facts strong{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; font-size:1.15rem; font-weight:650; letter-spacing:-.01em; margin-bottom:4px; }
  .facts .st{
    flex:none; font-family:var(--mono); font-size:.66rem; font-weight:600; letter-spacing:0;
    padding:3px 8px; border-radius:999px; border:1px solid var(--signal); color:var(--signal);
  }
  .facts .st.note{ border-color:var(--gold); color:var(--gold); }
  .facts span.d{ color:var(--on-blue-muted); }
  .facts a{ display:block; width:fit-content; margin-top:10px; color:var(--gold); font-weight:600; text-underline-offset:4px; }

  /* ---------------- PREIS ---------------- */
  .pricing{ background:var(--gold); color:var(--ink); padding:clamp(64px,9vw,112px) 0; --focus:var(--ink); --br:var(--ink); }
  .price-grid{ display:grid; grid-template-columns:1.25fr .75fr; gap:clamp(32px,6vw,80px); align-items:center; }
  .pricing h2{ font-size:clamp(2rem,3.8vw,3.2rem); }
  .pricing .text{ margin-top:18px; max-width:50ch; font-size:1.08rem; }
  .coins{ list-style:none; margin:22px 0 0; padding:0; display:flex; gap:8px; flex-wrap:wrap; }
  .coins li{ font-family:var(--mono); font-size:.76rem; font-weight:600; padding:5px 12px; border:1.5px solid var(--ink); border-radius:6px; }
  .price-box{ text-align:left; padding:26px 28px 28px; }
  .pricing .btn-ink{ --depth:#7F5F05; }
  .price{ font-size:clamp(4.2rem,9vw,7.2rem); font-weight:800; letter-spacing:-.05em; line-height:.95; }
  .price-note{ margin-top:6px; font-weight:550; }
  .price-box .btn{ margin-top:24px; width:100%; padding:16px 24px; font-size:1.05rem; }
  .buy-error{ margin-top:14px; font-weight:600; font-size:.95rem; display:none; }
  .fallback{ display:inline-block; margin-top:16px; font-size:.92rem; text-underline-offset:4px; }

  /* ---------------- FAQ ---------------- */
  .faq{ padding:clamp(72px,10vw,128px) 0; --focus:var(--blau); }
  .faq-grid{ display:grid; grid-template-columns:4fr 7fr; gap:clamp(32px,6vw,88px); align-items:start; }
  .faq h2{ font-size:clamp(1.9rem,3.4vw,2.9rem); }
  details{ border-top:1.5px solid var(--line-light); }
  details:last-child{ border-bottom:1.5px solid var(--line-light); }
  summary{
    list-style:none; cursor:pointer; padding:22px 0 22px 34px; position:relative;
    font-size:1.15rem; font-weight:650; letter-spacing:-.012em; line-height:1.3;
  }
  summary::-webkit-details-marker{ display:none; }
  summary::before{
    content:">"; position:absolute; left:2px; top:22px; font-family:var(--mono); font-weight:600; font-size:1rem; color:var(--blau);
    transition:transform .2s;
  }
  details[open] summary::before{ transform:rotate(90deg); }
  details p{ padding:0 0 24px 34px; color:var(--muted); max-width:62ch; }

  /* ---------------- FOOTER ---------------- */
  footer{ background:var(--tief); color:var(--on-blue-muted); padding:40px 0; }
  footer .wrap{ display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  footer .brand{ color:#fff; font-size:1.05rem; }
  footer p{ font-size:.9rem; max-width:58ch; }

  /* ---------------- RESPONSIVE ---------------- */
  @media (max-width:920px){
    .hero-grid, .why-grid, .trust-grid, .price-grid, .faq-grid{ grid-template-columns:1fr; }
    .nav-links{ display:none; }
    .nav .wrap{ justify-content:space-between; }
    .feat-grid{ grid-template-columns:1fr; }
    .steps{ grid-template-columns:1fr 1fr; row-gap:36px; }
    .steps li::after{ display:none; }
    .sticker{ transform:rotate(-.8deg); }
    .cmp .m{ font-size:.76rem; }
  }
  @media (max-width:520px){
    .wrap{ padding:0 20px; }
    .steps{ grid-template-columns:1fr; }
    .sticker{ padding:16px 18px 18px; }
    .chip{ font-size:.66rem; padding:6px 11px; }
  }
</style>
</head>
<body>

<noscript><p style="margin:0;padding:14px 20px;background:#F4C22B;color:#0C1240;font-family:sans-serif">Diese Seite braucht JavaScript, um Inhalt und Kauf-Button anzuzeigen.</p></noscript>

<!-- =======================================================================
     BEARBEITBARER INHALT
     Alle Texte, Preise und Links stehen hier zentral. Werte zwischen den
     Anführungszeichen ändern und speichern – der Rest muss nicht angefasst
     werden.
======================================================================= -->
<script>
const CONTENT = {
  brandName: "Nauru-Wlan",

  nav: {
    links: [
      { label: "Funktionen", href: "#funktionen" },

      const a = Math.PI * i / 12 - Math.PI / 2;
      pts.push((12 + r * Math.cos(a)).toFixed(2) + ',' + (12 + r * Math.sin(a)).toFixed(2));
    }
    return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" aria-hidden="true"><polygon points="' + pts.join(' ') + '" fill="' + fill + '"/></svg>';
  }

     HEADLINE: entschluesselt sich einmal beim Laden (Layout bleibt stabil,

  ===================================================================== */
  (function(){
    const h1 = $('hero-headline');
    h1.setAttribute('aria-label', C.hero.lines.join(' '));
    const GLYPHS = '0123456789ABCDEF';
    const chars = [];
    let t0 = 0;
    C.hero.lines.forEach((line, li) => {
      const ln = document.createElement('span'); ln.className = 'ln'; ln.setAttribute('aria-hidden', 'true');
      let idx = 0;
      line.split(' ').forEach((word, wi, arr) => {
        const w = document.createElement('span'); w.style.whiteSpace = 'nowrap';
        word.split('').forEach(ch => {
          const s = document.createElement('span'); s.className = 'ch'; s.textContent = ch;
          if (!reduce){
            s.classList.add('pre');
            const start = 250 + li * 520 + idx * 26;
            chars.push({ el: s, start: start, end: start + 150 + Math.random() * 130 });
          }
          idx++; w.appendChild(s);
        });
        ln.appendChild(w);
        if (wi < arr.length - 1){ ln.appendChild(document.createTextNode(' ')); idx++; }
      });
      h1.appendChild(ln);
    });
    const caret = document.createElement('span'); caret.className = 'caret'; caret.setAttribute('aria-hidden', 'true');
    h1.lastChild.appendChild(caret);
    if (reduce) return;
    setTimeout(() => { caret.style.transition = 'opacity .5s'; caret.style.opacity = '0'; }, 6500);

    const t = performance.now();
    let last = 0;
    (function frame(now){
      const el = now - t;
      let open = 0;
      if (el - last > 45){
        last = el;
        chars.forEach(c => {
          if (c.done) return;
          if (el < c.start){ open++; return; }
          if (el < c.end){
            open++;
            c.el.className = 'ch s';
            c.el.setAttribute('data-r', GLYPHS[Math.random() * GLYPHS.length | 0]);
          } else {
            c.el.className = 'ch'; c.el.removeAttribute('data-r'); c.done = true;
          }
        });
        if (!open) return;
      }
      requestAnimationFrame(frame);
    })(t);
  })();

  /* =====================================================================
     LIVE-DEMO: wuerfelt eine lokal administrierte Unicast-Adresse
     (gleiche Regel wie im Tool: Bit 1 gesetzt, Bit 0 geloescht) und zeigt
     dieselben Schritte wie das echte Tool.
  ===================================================================== */
  (function(){
    const HEX = '0123456789ABCDEF';
    const macEl = $('mac'), barcode = $('barcode'), btn = $('roll'), sticker = $('sticker'), logEl = $('log');
    const used = new Set();
    let current = '', count = 1, rolling = false, touched = false;
    const timers = [];

    function newMac(){
      let key;
      do {
        const b = new Uint8Array(6); crypto.getRandomValues(b);
        b[0] = (b[0] & 0xFE) | 0x02;
        key = Array.from(b).map(x => x.toString(16).toUpperCase().padStart(2, '0')).join('');
      } while (used.has(key));
      used.add(key);
      return key;
    }
    const fmt = chars => { const p = []; for (let i = 0; i < 12; i += 2) p.push(chars[i] + chars[i + 1]); return p; };
    function render(chars){
      macEl.innerHTML = fmt(chars).map((x, i) => i === 0 ? x[0] + '<span class="nib">' + x[1] + '</span>' : x).join('<i>:</i>');
    }
    function drawBarcode(hex){
      let x = 0, r = '';
      const bar = w => { r += '<rect x="' + x + '" y="0" width="' + w + '" height="44"/>'; x += w; };
      bar(2); x += 1; bar(1); x += 2;
      for (const ch of hex){
        const v = parseInt(ch, 16);
        for (let b = 3; b >= 0; b--){ const bit = (v >> b) & 1; bar(bit ? 3 : 1); x += bit ? 1 : 2; }
      }
      bar(1); x += 1; bar(2);
      barcode.setAttribute('viewBox', '0 0 ' + x + ' 44');
      barcode.innerHTML = r;
    }

    /* --- Konsole --- */
    function logClear(){ logEl.innerHTML = ''; }
    function logAdd(text, cls){
      const li = document.createElement('li'); if (cls) li.className = cls;
      const p = document.createElement('span'); p.className = 'p'; p.textContent = '>';
      const t = document.createElement('span'); t.textContent = text;
      const s = document.createElement('span'); s.className = 's'; s.textContent = cls === 'final' ? '' : '...';
      li.append(p, t, s); logEl.appendChild(li);
      return li;
    }
    function logOk(li){ const s = li.querySelector('.s'); s.textContent = 'ok'; s.classList.add('ok'); }
    function ledgerAdd(hex){
      const ol = $('ledger');
      const empty = ol.querySelector('.empty'); if (empty) empty.remove();
      const li = document.createElement('li');
      li.textContent = fmt(hex.split('')).join(':');
      ol.insertBefore(li, ol.firstChild);
      while (ol.children.length > 3) ol.removeChild(ol.lastChild);
    }

    function label(){ $('sticker-count').textContent = 'Adresse ' + count; }
    function finish(){
      drawBarcode(current); label();
      const pretty = fmt(current.split('')).join(':');
      const li = logAdd(C.hero.logDone + ' ' + pretty, 'final');
      li.querySelector('span:nth-child(2)').style.color = 'var(--signal)';
      $('mac-live').textContent = 'Neue MAC-Adresse: ' + pretty;
      sticker.classList.remove('scanning');
      rolling = false; btn.disabled = false;
    }
    function animateTo(target){
      if (reduce){ render(target); finish(); return; }
      const start = performance.now(), settle = i => 380 + i * 70, total = settle(11) + 80;
      let last = -100;
      function frame(t){
        const el = t - start;
        if (el - last > 45){
          last = el;
          render(target.map((c, i) => el >= settle(i) ? c : HEX[Math.random() * 16 | 0]));
        }
        if (el < total) requestAnimationFrame(frame);
        else { render(target); finish(); }
      }
      requestAnimationFrame(frame);
    }
    function roll(){
      if (rolling) return;
      rolling = true; btn.disabled = true;
      const old = current;
      current = newMac();
      count++;
      ledgerAdd(old);
      logClear();
      const steps = C.hero.logSteps;
      if (reduce){
        steps.forEach(s => logOk(logAdd(s)));
      } else {
        sticker.classList.remove('scanning'); void sticker.offsetWidth; sticker.classList.add('scanning');
        const plan = [[0, 260], [380, 720], [760, 1100]];
        steps.forEach((s, i) => {
          let li;
          timers.push(setTimeout(() => { li = logAdd(s); }, plan[i][0]));
          timers.push(setTimeout(() => { if (li) logOk(li); }, plan[i][1]));
        });
      }
      animateTo(current.split(''));
    }

    // Startzustand
    const e = document.createElement('li'); e.className = 'empty'; e.textContent = C.hero.ledgerEmpty; $('ledger').appendChild(e);
    logAdd(C.hero.logIdle, 'final');
    current = newMac();
    render(current.split('')); drawBarcode(current); label();

    btn.addEventListener('click', () => { touched = true; roll(); });
    // Tastenkuerzel R, solange die Demo im Bild ist und nicht getippt wird
    document.addEventListener('keydown', ev => {
      if (ev.key.toLowerCase() !== 'r' || ev.ctrlKey || ev.metaKey || ev.altKey) return;
      if (/^(input|textarea|select)$/i.test(document.activeElement.tagName)) return;
      const r = sticker.getBoundingClientRect();
      if (r.bottom < 0 || r.top > window.innerHeight) return;
      touched = true; roll();
    });

    // Ein einziger automatischer Moment: nach der Headline wuerfelt die Adresse einmal.
    if (!reduce){
      setTimeout(() => { if (!touched) roll(); }, 2700);
    }
  })();

  /* =====================================================================
     SCROLL: Fortschrittsbalken, Ablauf-Kette und Scan-Raster
     (nur wenn Bewegung erlaubt ist; sonst sofort im Endzustand)
  ===================================================================== */
  (function(){
    const bar = $('progress');
    function upd(){
      const h = document.documentElement;
      const max = h.scrollHeight - h.clientHeight;
      const p = max > 0 ? h.scrollTop / max : 0;
      bar.style.transform = 'scaleX(' + Math.min(1, Math.max(0, p)) + ')';
    }
    let ticking = false;
    window.addEventListener('scroll', () => {
      if (ticking) return; ticking = true;
      requestAnimationFrame(() => { upd(); ticking = false; });
    }, { passive: true });
    window.addEventListener('resize', upd);
    upd();

    if (reduce || !('IntersectionObserver' in window)) return;
    const targets = [$('steps'), $('vt')];
    targets.forEach(el => el.classList.add('anim'));
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => { if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
    }, { threshold: 0.4 });
    targets.forEach(el => io.observe(el));
  })();
</script>
