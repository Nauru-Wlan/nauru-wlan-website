        <svg class="barcode" id="barcode" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="sticker-foot">
          <button class="btn btn-ink" id="roll" type="button"></button>
          <p id="sticker-note"></p>
        </div>
        <span class="sr-only" id="mac-live" aria-live="polite"></span>
      </div>
      <div class="ledger">
        <p class="ledger-title" id="ledger-title"></p>
        <ol id="ledger"></ol>
      </div>

<section class="why">
  <div class="wrap why-grid">

      <h2 id="why-heading"></h2>

    </div>
    <div>
      <div class="table-scroll">
        <table class="cmp">
          <thead><tr id="cmp-head"></tr></thead>
          <tbody id="cmp-body"></tbody>
        </table>
      </div>
      <p class="cmp-note" id="cmp-note"></p>
    </div>
  </div>
</section>

<section class="features" id="funktionen">
  <div class="wrap">
    <h2 id="features-heading"></h2>
    <div class="feat-grid" id="feat-grid"></div>

    <div class="steps-wrap">
      <h2 id="steps-heading"></h2>
      <ol class="steps" id="steps"></ol>
    </div>
  </div>
</section>

<section class="trust" id="sicherheit">
  <div class="wrap trust-grid">
    <div>
      <h2 id="trust-heading"></h2>
      <p class="text" id="trust-text"></p>
      <div class="vt">
        <div class="vt-grid" id="vt-grid" role="img" aria-label="64 Virenscanner, davon 7 mit generischem Verdacht"></div>
        <p id="vt-caption"></p>
      </div>
    </div>
    <ul class="facts" id="facts"></ul>
  </div>

<section class="pricing" id="preis">
  <div class="wrap price-grid">
    <div>
      <h2 id="pricing-heading"></h2>
      <p class="text" id="pricing-text"></p>
    </div>
    <div class="price-box">
      <div class="price" id="pricing-amount"></div>
      <div class="price-note" id="pricing-note"></div>
      <button class="btn btn-ink" id="pricing-cta" type="button"></button>
      <p class="buy-error" id="buy-error" role="alert"></p>
      <a class="fallback" id="pricing-discord-fallback" target="_blank" rel="noopener"></a>
    </div>
  </div>
</section>

<section class="faq" id="faq">
  <div class="wrap faq-grid">
    <h2 id="faq-heading"></h2>
    <div id="faq-list"></div>
  </div>
</section>

</main>

<footer>
  <div class="wrap">
    <span class="brand" id="footer-brand"></span>
    <p id="footer-note"></p>
  </div>
</footer>

<script>
  /* ---------- Markenzeichen: 12-zackiger Stern (12 Hex-Ziffern einer MAC) ---------- */
  function starSVG(size, fill){
    const pts = [];
    for (let i = 0; i < 24; i++){
      const r = i % 2 === 0 ? 11.6 : 6.4;
      const a = Math.PI * i / 12 - Math.PI / 2;
      pts.push((12 + r * Math.cos(a)).toFixed(2) + ',' + (12 + r * Math.sin(a)).toFixed(2));
    }
    return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" aria-hidden="true"><polygon points="' + pts.join(' ') + '" fill="' + fill + '"/></svg>';
  }
  (function(){
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#1A2FA0"/><g transform="translate(3.6 3.6) scale(.7)">' +
      starSVG(24, '#F4C22B').replace(/^<svg[^>]*>/, '').replace('</svg>', '') + '</g></svg>';
    document.getElementById('favicon').href = 'data:image/svg+xml,' + encodeURIComponent(svg);
  })();

  /* ---------- Statischer Inhalt aus CONTENT ---------- */
  const $ = id => document.getElementById(id);
  const C = CONTENT;

  $('nav-brand').innerHTML = starSVG(26, '#F4C22B') + '<span>' + C.brandName + '</span>';
  $('footer-brand').innerHTML = starSVG(22, '#F4C22B') + '<span>' + C.brandName + '</span>';
  $('footer-note').textContent = C.footer.note;

  C.nav.links.forEach(l => {
    const a = document.createElement('a');
    a.href = l.href; a.textContent = l.label;
    $('nav-links').appendChild(a);
  });
  $('nav-cta').href = C.nav.ctaHref; $('nav-cta').textContent = C.nav.ctaLabel;

  C.hero.lines.forEach(t => {
    const s = document.createElement('span'); s.textContent = t; $('hero-headline').appendChild(s);
  });
  $('hero-lead').textContent = C.hero.lead;
  $('hero-cta-primary').href = C.hero.ctaPrimaryHref;     $('hero-cta-primary').textContent = C.hero.ctaPrimaryLabel;
  $('hero-cta-secondary').href = C.hero.ctaSecondaryHref; $('hero-cta-secondary').textContent = C.hero.ctaSecondaryLabel;
  $('sticker-label').textContent = C.hero.stickerLabel;
  $('roll').textContent = C.hero.rollLabel;
  $('sticker-note').textContent = C.hero.stickerNote;
  $('ledger-title').textContent = C.hero.ledgerTitle;

  $('why-heading').textContent = C.context.heading;
  $('why-text').textContent = C.context.text;
  C.context.tableHead.forEach((h, i) => {
    const th = document.createElement('th'); th.scope = 'col'; th.textContent = h; $('cmp-head').appendChild(th);
  });
  C.context.rows.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = '<th scope="row"></th><td class="m"><span class="same"></span></td><td class="m"></td>';
    tr.children[0].textContent = r.net;
    tr.children[1].firstChild.textContent = C.context.sameMac;
    tr.children[2].textContent = r.fresh;
    $('cmp-body').appendChild(tr);
  });
  $('cmp-note').textContent = C.context.note;

  $('features-heading').textContent = C.features.heading;
  C.features.items.forEach(f => {
    const d = document.createElement('div'); d.className = 'feat';
    d.innerHTML = '<h3></h3><p></p>';
    d.children[0].textContent = f.title; d.children[1].textContent = f.text;
    $('feat-grid').appendChild(d);
  });
  $('steps-heading').textContent = C.steps.heading;
  C.steps.items.forEach(s => {
    const li = document.createElement('li');
    li.innerHTML = '<h3></h3><p></p>';
    li.children[0].textContent = s.title; li.children[1].textContent = s.text;
    $('steps').appendChild(li);
  });

  $('trust-heading').textContent = C.trust.heading;
  $('trust-text').textContent = C.trust.text;
  $('vt-caption').textContent = C.trust.scanCaption;
  for (let i = 0; i < 64; i++){
    const c = document.createElement('span');
    if (C.trust.scanHits.includes(i)) c.className = 'hit';
    $('vt-grid').appendChild(c);
  }
  C.trust.items.forEach(it => {
    const li = document.createElement('li');
    li.innerHTML = '<strong></strong><span></span>';
    li.children[0].textContent = it.title; li.children[1].textContent = it.text;
    if (it.linkLabel){
      const a = document.createElement('a');
      a.href = it.linkHref; a.target = '_blank'; a.rel = 'noopener'; a.textContent = it.linkLabel;
      li.appendChild(a);
    }
    $('facts').appendChild(li);
  });

  $('pricing-heading').textContent = C.pricing.heading;
  $('pricing-text').textContent = C.pricing.text;
  $('pricing-amount').textContent = C.pricing.amount;
  $('pricing-note').textContent = C.pricing.note;
  $('pricing-cta').textContent = C.pricing.ctaLabel;
  $('pricing-discord-fallback').href = C.pricing.discordFallbackHref;
  $('pricing-discord-fallback').textContent = C.pricing.discordFallbackLabel;

  $('faq-heading').textContent = C.faq.heading;
  C.faq.items.forEach(item => {
    const d = document.createElement('details');
    d.innerHTML = '<summary></summary><p></p>';
    d.children[0].textContent = item.q; d.children[1].textContent = item.a;
    $('faq-list').appendChild(d);
  });

  /* ---------- Kaufen: legt die Bestellung an und leitet zur Zahlung weiter ---------- */
  (function(){
    const btn = $('pricing-cta'), err = $('buy-error');
    btn.addEventListener('click', async () => {
      const label = C.pricing.ctaLabel;
      err.style.display = 'none';
      btn.disabled = true; btn.textContent = C.pricing.ctaBusy;
      try {
        const res = await fetch(C.pricing.apiUrl + '?action=create_order');
        const data = await res.json();
        if (data.invoiceUrl){ window.location.href = data.invoiceUrl; }
        else { throw new Error('no invoice url'); }
      } catch (e) {
        btn.disabled = false; btn.textContent = label;
        err.textContent = C.pricing.errorText; err.style.display = 'block';
      }
    });
  })();

  /* =====================================================================
     LIVE-DEMO: würfelt eine lokal administrierte Unicast-Adresse
     (gleiche Regel wie im Tool: Bit 1 gesetzt, Bit 0 gelöscht)
  ===================================================================== */
  (function(){
    const HEX = '0123456789ABCDEF';
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const macEl = $('mac'), barcode = $('barcode'), btn = $('roll');
    const used = new Set();
    let current = '', count = 1, rolling = false, touched = false;

    function newMac(){
      let key;
      do {
        const b = new Uint8Array(6); crypto.getRandomValues(b);
        b[0] = (b[0] & 0xFE) | 0x02;
        key = Array.from(b).map(x => x.toString(16).toUpperCase().padStart(2, '0')).join('');
      } while (used.has(key));
      used.add(key);
      return key;
    }
    function fmt(chars){
      const p = [];
      for (let i = 0; i < 12; i += 2) p.push(chars[i] + chars[i + 1]);
      return p;
    }
    function render(chars){
      const p = fmt(chars);
      macEl.innerHTML = p.map((x, i) => i === 0 ? x[0] + '<span class="nib">' + x[1] + '</span>' : x).join('<i>:</i>');
    }
    function drawBarcode(hex){
      let x = 0, r = '';
      const bar = w => { r += '<rect x="' + x + '" y="0" width="' + w + '" height="44"/>'; x += w; };
      bar(2); x += 1; bar(1); x += 2;
      for (const ch of hex){
        const v = parseInt(ch, 16);
        for (let b = 3; b >= 0; b--){
          const bit = (v >> b) & 1;
          bar(bit ? 3 : 1); x += bit ? 1 : 2;
        }
      }
      bar(1); x += 1; bar(2);
      barcode.setAttribute('viewBox', '0 0 ' + x + ' 44');
      barcode.innerHTML = r;
    }
    function ledgerAdd(hex){
      const ol = $('ledger');
      const empty = ol.querySelector('.empty'); if (empty) empty.remove();
      const li = document.createElement('li');
      li.textContent = fmt(hex.split('')).join(':');
      ol.insertBefore(li, ol.firstChild);
      while (ol.children.length > 4) ol.removeChild(ol.lastChild);
    }
    function label(){ $('sticker-count').textContent = 'Adresse ' + count; }
    function finish(){
      drawBarcode(current); label();
      $('mac-live').textContent = 'Neue MAC-Adresse: ' + fmt(current.split('')).join(':');
      rolling = false; btn.disabled = false;
    }
    function animateTo(target){
      if (reduce){ render(target); finish(); return; }
      const start = performance.now(), settle = i => 380 + i * 70, total = settle(11) + 80;
      let last = -100;
      function frame(t){
        const el = t - start;
        if (el - last > 45){
          last = el;
          render(target.map((c, i) => el >= settle(i) ? c : HEX[Math.random() * 16 | 0]));
        }
        if (el < total) requestAnimationFrame(frame);
        else { render(target); finish(); }
      }
      requestAnimationFrame(frame);
    }
    function roll(){
      if (rolling) return;
      rolling = true; btn.disabled = true;
      const old = current;
      current = newMac();
      count++;
      ledgerAdd(old);
      animateTo(current.split(''));
    }

    // Startzustand
    const ol = $('ledger');
    const e = document.createElement('li'); e.className = 'empty'; e.textContent = C.hero.ledgerEmpty; ol.appendChild(e);
    current = newMac();
    render(current.split('')); drawBarcode(current); label();

    btn.addEventListener('click', () => { touched = true; roll(); });

    // Ein einziger Moment beim Laden: die Adresse würfelt einmal von selbst.
    if (!reduce){
      setTimeout(() => { if (!touched) roll(); }, 1300);
    }
  })();
</script>

</body>
</html>
